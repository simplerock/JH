<title>Familjen prototyp</title>
<style>
/* Layout: en mobilskärm i taget. Grupperade listor på mjuk yta, inga ramar. Färg bara för progress, klart och försenat. */
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --ink: #1d1f1e;
  --muted: #6f736f;
  --line: #ebe7df;
  --track: #ebe7df;
  --accent: #2f6f55;
  --accent-ink: #ffffff;
  --accent-soft: #e3efe8;
  --warn: #c2552d;
  --warn-soft: #f8e6dd;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131514; --surface: #1c1f1d; --ink: #eceeed; --muted: #9aa09d; --line: #2a2e2c; --track: #2a2e2c;
    --accent: #5fbf93; --accent-ink: #0f1d16; --accent-soft: #1d3127; --warn: #ef8a62; --warn-soft: #3a241b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131514; --surface: #1c1f1d; --ink: #eceeed; --muted: #9aa09d; --line: #2a2e2c; --track: #2a2e2c;
  --accent: #5fbf93; --accent-ink: #0f1d16; --accent-soft: #1d3127; --warn: #ef8a62; --warn-soft: #3a241b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.proto-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; padding: 12px 16px; font-size: 13px; color: var(--muted); }
.proto-bar strong { color: var(--ink); font-weight: 600; }
.seg { display: inline-flex; background: var(--track); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { padding: 5px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.phone { position: relative; max-width: 400px; margin: 0 auto 24px; background: var(--bg); min-height: 720px; display: flex; flex-direction: column; }
@media (min-width: 520px) { .phone { border-radius: 36px; box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgb(0 0 0 / .08); overflow: hidden; height: 800px; } }
.screen { flex: 1; overflow-y: auto; padding: 28px 16px 24px; display: flex; flex-direction: column; gap: 28px; }

.head .date { font-size: 13px; color: var(--muted); text-transform: capitalize; }
.head h1 { margin: 2px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.back { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 6px; }

section > h2 { margin: 0 0 8px; padding: 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; }
section > h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.group { background: var(--surface); border-radius: var(--radius); padding: 0 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 0; min-height: 56px; }
.row + .row { border-top: 1px solid var(--line); }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 500; }
.row .sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
.row .end { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; flex-shrink: 0; }
.row.done .title { color: var(--muted); text-decoration: line-through; }
.row.tap { width: 100%; text-align: left; }

.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; display: grid; place-items: center; transition: transform .1s; }
.check:active { transform: scale(.88); }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check svg { width: 14px; height: 14px; }
.check:disabled { opacity: .35; cursor: default; }

.bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.bar.over > i { background: var(--warn); }
@media (prefers-reduced-motion: reduce) { .bar > i, .check { transition: none; } }

.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--track); color: var(--muted); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.warn-text { color: var(--warn) !important; }

.hero { background: var(--accent-soft); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 2px; text-align: left; width: 100%; }
.hero .k { color: var(--accent); font-size: 14px; font-weight: 600; }
.hero .t { font-size: 20px; font-weight: 700; }
.hero .s { color: var(--muted); font-size: 14px; }

.big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--muted); padding: 0 4px; }
.empty { padding: 18px 0; color: var(--muted); font-size: 15px; }
.done-toggle { color: var(--muted); font-size: 14px; padding: 12px 0; width: 100%; text-align: left; border-top: 1px solid var(--line); }

nav.tabs { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 12px; font-size: 11px; font-weight: 500; color: var(--muted); }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs svg { width: 22px; height: 22px; }
.chev { color: var(--muted); width: 18px; height: 18px; flex-shrink: 0; }
</style>

<div class="proto-bar">
  <span>Visa som</span>
  <div class="seg" id="who" role="group" aria-label="Välj person"></div>
  <span>Prototyp med påhittad data. Avbockningar sparas bara här.</span>
</div>

<div class="phone">
  <main class="screen" id="screen" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="Meny"></nav>
</div>

<script>
const ICON = {
  home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  goal: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  routine: '<path d="M4 12.5 9 17.5 20 6.5"/>',
  house: '<path d="M4 20V10l8-6 8 6v10"/><path d="M10 20v-5h4v5"/>',
  more: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  back: '<path d="m15 6-6 6 6 6"/>',
  tick: '<path d="M3 8.5 6.5 12 13 4.5"/>',
};
const svg = (k, cls = "", vb = "0 0 24 24") => `<svg class="${cls}" viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

// ---- Datum -------------------------------------------------------------
const DAY = 86400000;
const today = new Date(); today.setHours(0, 0, 0, 0);
const iso = (d) => d.toISOString().slice(0, 10);
const plus = (n) => iso(new Date(today.getTime() + n * DAY));
const daysTo = (s) => Math.round((new Date(s + "T00:00:00") - today) / DAY);
const fmt = (s) => new Intl.DateTimeFormat("sv-SE", { day: "numeric", month: "short" }).format(new Date(s + "T00:00:00"));
const kr = (n) => new Intl.NumberFormat("sv-SE").format(n) + " kr";
const inDays = (n) => n === 0 ? "Idag" : n === 1 ? "Imorgon" : n < 0 ? `${-n} dagar sen` : `Om ${n} dagar`;
const week = (() => { const d = new Date(today); d.setDate(d.getDate() + 4 - (d.getDay() || 7)); const y = new Date(d.getFullYear(), 0, 1); return Math.ceil(((d - y) / DAY + 1) / 7); })();

// ---- Påhittad familj ----------------------------------------------------
const people = [
  { id: "anna", name: "Anna", role: "parent", color: "#2f6f55" },
  { id: "erik", name: "Erik", role: "parent", color: "#4f7cff" },
  { id: "ella", name: "Ella", role: "child", color: "#e08a1e" },
];
const P = Object.fromEntries(people.map((p) => [p.id, p]));

const tasks = [
  { id: "t1", title: "Diska", area: "Kök", rec: "Varje dag", who: "erik" },
  { id: "t2", title: "Duka av", area: "Kök", rec: "Varje dag", who: "ella" },
  { id: "t3", title: "Mata katten", area: "Kök", rec: "Varje dag", who: "ella" },
  { id: "t4", title: "Dammsuga", area: "Vardagsrum", rec: "Varje vecka", who: "ella" },
  { id: "t5", title: "Städa badrummet", area: "Badrum", rec: "Varje vecka", who: "anna" },
  { id: "t6", title: "Tvätta", area: "Tvätt", rec: "Varje vecka", who: "anna" },
  { id: "t7", title: "Byta lakan", area: "Sovrum", rec: "Varje vecka", who: "erik" },
  { id: "t8", title: "Handla storhandling", area: "Övrigt", rec: "Varje vecka", who: "erik" },
  { id: "t9", title: "Betala räkningar", area: "Övrigt", rec: "Varje månad", who: "anna" },
];
const startDone = ["t1", "t5"];

const goals = [
  { title: "Semesterkassa Italien", cat: "Semester", cur: 18500, target: 30000, unit: "kr", owner: "anna", due: plus(220) },
  { title: "Buffert tre månadslöner", cat: "Ekonomi", cur: 62000, target: 120000, unit: "kr", owner: "erik", due: plus(400) },
  { title: "Spara till cykel", cat: "Barnen", cur: 1200, target: 3500, unit: "kr", owner: "ella", due: plus(150) },
  { title: "Läsa 20 böcker", cat: "Barnen", cur: 13, target: 20, unit: "böcker", owner: "ella", due: plus(88) },
];

const projects = [
  { title: "Nytt badrum", status: "Pågår", budget: 180000, spent: 112000, owner: "erik", steps: [["Riva kakel", 1], ["Rör och el", 1], ["Tätskikt", 1], ["Kakla", 0], ["Montera", 0]] },
  { title: "Måla staketet", status: "Planerat", budget: 6000, spent: 0, owner: "anna", steps: [["Köpa färg", 0], ["Skrapa", 0], ["Måla", 0]] },
  { title: "Altan", status: "Idé", budget: 60000, spent: 0, owner: null, steps: [] },
];

const maint = [
  { title: "Byta filter i ventilationen", every: 180, last: plus(-186), owner: "erik" },
  { title: "Rensa takrännor", every: 365, last: plus(-352), owner: "erik" },
  { title: "Avfrosta frysen", every: 180, last: plus(-120), owner: "anna" },
  { title: "Testa brandvarnare", every: 90, last: plus(-80), owner: "ella" },
  { title: "Service på bilen", every: 365, last: plus(-200), owner: null },
];

const events = [
  { title: "Sommar i Toscana", kind: "Semester", start: plus(40), end: plus(53), place: "Lucca, Italien", pack: [["Pass", 1], ["Boka hundvakt", 0], ["Laddare", 0], ["Solkräm", 0]] },
  { title: "Ellas fotbollsmatch", kind: "Aktivitet", start: plus(3) },
  { title: "Mormor fyller 70", kind: "Händelse", start: plus(12) },
  { title: "Utvecklingssamtal", kind: "Händelse", start: plus(18) },
];

const budget = [
  { name: "Mat", limit: 9000, spent: 6420 },
  { name: "Bil", limit: 2500, spent: 2810 },
  { name: "Nöje", limit: 2000, spent: 900 },
  { name: "Barnen", limit: 1500, spent: 1150 },
  { name: "Hem", limit: 3000, spent: 600 },
];

// ---- Tillstånd ----------------------------------------------------------
const store = {
  get(k, d) { try { const v = localStorage.getItem("familjen:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("familjen:" + k, JSON.stringify(v)); } catch {} },
};
let done = new Set(store.get("done", startDone));
let me = store.get("me", "anna");
let tab = store.get("tab", "hem");
let sub = null;          // undersida under Mer: kalender, budget, familj, eller ett event-index
let routineFilter = "mina";
let houseView = "projekt";
let showDone = false;

const isParent = () => P[me].role === "parent";
const mine = (list, key = "who") => list.filter((x) => x[key] === me);
const pct = (a, b) => (b > 0 ? Math.min(1, a / b) : 0);
const bar = (r, over) => `<div class="bar${over ? " over" : ""}"><i style="width:${Math.round(r * 100)}%"></i></div>`;
const dot = (id) => (id ? `<span class="dot" style="background:${P[id].color}" title="${P[id].name}">${P[id].name[0]}</span>` : "");
const dueIn = (m) => daysTo(m.last) + m.every;

function taskRow(t, { showWho } = {}) {
  const d = done.has(t.id);
  const can = isParent() || t.who === me;
  return `<div class="row${d ? " done" : ""}">
    <button class="check" data-task="${t.id}" aria-pressed="${d}" ${can ? "" : "disabled"} aria-label="${d ? "Ångra" : "Bocka av"} ${t.title}">${d ? svg("tick", "", "0 0 16 16") : ""}</button>
    <div class="main"><div class="title">${t.title}</div><div class="sub">${t.area} · ${t.rec}</div></div>
    ${showWho ? dot(t.who) : ""}
  </div>`;
}

function goalRow(g) {
  const r = pct(g.cur, g.target);
  const n = (v) => (g.unit === "kr" ? new Intl.NumberFormat("sv-SE").format(v) : v);
  return `<div class="row" style="display:block">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
      <div class="title" style="min-width:0">${g.title}</div><div class="end">${Math.round(r * 100)}%</div>
    </div>
    ${bar(r)}
    <div class="sub" style="display:flex;justify-content:space-between;margin-top:6px"><span>${n(g.cur)} av ${n(g.target)} ${g.unit}</span><span>${daysTo(g.due)} dagar kvar</span></div>
  </div>`;
}

function maintRow(m, showOwner = true) {
  const n = dueIn(m);
  const late = n < 0;
  return `<div class="row">
    <div class="main"><div class="title">${m.title}</div><div class="sub ${late ? "warn-text" : ""}">${late ? `Försenad ${-n} dagar` : n === 0 ? "Idag" : `Om ${n} dagar`} · var ${m.every}:e dag</div></div>
    ${showOwner ? dot(m.owner) : ""}
  </div>`;
}

function projectRow(p) {
  const stepsDone = p.steps.filter((s) => s[1]).length;
  const r = p.steps.length ? stepsDone / p.steps.length : 0;
  return `<div class="row" style="display:block">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
      <div class="title">${p.title}</div><span class="pill ${p.status === "Pågår" ? "ok" : ""}">${p.status}</span>
    </div>
    ${p.steps.length ? `${bar(r)}<div class="sub" style="margin-top:6px">${stepsDone} av ${p.steps.length} steg · ${kr(p.spent)} av ${kr(p.budget)}</div>` : `<div class="sub">Budget ${kr(p.budget)}</div>`}
  </div>`;
}

// ---- Skärmar ------------------------------------------------------------
function head(title, date) {
  const d = new Intl.DateTimeFormat("sv-SE", { weekday: "long", day: "numeric", month: "long" }).format(today);
  return `<header class="head">${date ? `<div class="date">${d}</div>` : ""}<h1>${title}</h1></header>`;
}

function hem() {
  const vac = events.find((e) => e.kind === "Semester");
  const my = mine(tasks);
  const open = my.filter((t) => !done.has(t.id));
  const closed = my.filter((t) => done.has(t.id));
  const myMaint = mine(maint, "owner").filter((m) => dueIn(m) <= 30).sort((a, b) => dueIn(a) - dueIn(b));
  const myProj = mine(projects, "owner").filter((p) => p.status !== "Klart");
  const myGoals = mine(goals, "owner");
  const orphans = [...projects, ...maint, ...goals].filter((x) => !x.owner).length;

  return `${head(`Hej ${P[me].name}`, true)}
    ${vac ? `<button class="hero" data-open-event="0"><span class="k">${inDays(daysTo(vac.start))}</span><span class="t">${vac.title}</span><span class="s">${fmt(vac.start)} – ${fmt(vac.end)}</span></button>` : ""}
    <section><h2>Att göra <span>${closed.length} av ${my.length} klara</span></h2>
      <div class="group">
        ${open.length ? open.map((t) => taskRow(t)).join("") : `<div class="empty">Allt klart. Snyggt.</div>`}
        ${closed.length ? `<button class="done-toggle" data-toggle-done>${showDone ? "Dölj klara" : `Visa klara (${closed.length})`}</button>${showDone ? closed.map((t) => taskRow(t)).join("") : ""}` : ""}
      </div>
    </section>
    ${myMaint.length ? `<section><h2>Underhåll snart</h2><div class="group">${myMaint.map((m) => maintRow(m, false)).join("")}</div></section>` : ""}
    ${myProj.length ? `<section><h2>Dina projekt</h2><div class="group">${myProj.map(projectRow).join("")}</div></section>` : ""}
    ${myGoals.length ? `<section><h2>Dina mål</h2><div class="group">${myGoals.map(goalRow).join("")}</div></section>` : ""}
    ${isParent() && orphans ? `<p class="note">${orphans} saker saknar ansvarig. <button data-tab="hemmet" style="color:var(--accent);font-weight:500">Fördela</button></p>` : ""}`;
}

function mal() {
  return `${head("Mål")}
    <section><div class="group">${goals.map(goalRow).join("")}</div></section>
    <p class="note">Varje mål har en ansvarig. Det syns på deras hem.</p>`;
}

function rutiner() {
  const list = routineFilter === "mina" ? mine(tasks) : tasks;
  const groups = ["Varje dag", "Varje vecka", "Varje månad"];
  const perPerson = people.map((p) => {
    const t = tasks.filter((x) => x.who === p.id);
    const d = t.filter((x) => done.has(x.id)).length;
    return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span class="title" style="display:flex;gap:8px;align-items:center">${dot(p.id)}${p.name}</span><span class="end">${d} av ${t.length}</span></div>${bar(pct(d, t.length))}</div>`;
  }).join("");
  return `${head("Rutiner")}
    <div class="seg" role="group" aria-label="Filter" style="align-self:flex-start">
      <button data-filter="mina" aria-pressed="${routineFilter === "mina"}">Mina</button>
      <button data-filter="alla" aria-pressed="${routineFilter === "alla"}">Alla</button>
    </div>
    ${groups.map((g) => {
      const l = list.filter((t) => t.rec === g);
      if (!l.length) return "";
      const label = g === "Varje dag" ? "Idag" : g === "Varje vecka" ? `Vecka ${week}` : "Den här månaden";
      return `<section><h2>${label} <span>${l.filter((t) => done.has(t.id)).length} av ${l.length}</span></h2><div class="group">${l.map((t) => taskRow(t, { showWho: routineFilter === "alla" })).join("")}</div></section>`;
    }).join("")}
    <section><h2>Hela familjen</h2><div class="group">${perPerson}</div></section>`;
}

function hemmet() {
  const sorted = [...maint].sort((a, b) => dueIn(a) - dueIn(b));
  return `${head("Hemmet")}
    <div class="seg" role="group" aria-label="Visa" style="align-self:flex-start">
      <button data-house="projekt" aria-pressed="${houseView === "projekt"}">Projekt</button>
      <button data-house="underhall" aria-pressed="${houseView === "underhall"}">Underhåll</button>
    </div>
    ${houseView === "projekt"
      ? projects.map((p) => `<section><div class="group">${projectRow(p)}${p.steps.length ? p.steps.map(([s, d]) => `<div class="row${d ? " done" : ""}"><span class="check" aria-hidden="true" ${d ? 'style="background:var(--accent);border-color:var(--accent);color:var(--accent-ink)"' : ""}>${d ? svg("tick", "", "0 0 16 16") : ""}</span><div class="main"><div class="title">${s}</div></div></div>`).join("") : ""}<div class="row"><span class="sub">Ansvarig</span><span style="flex:1"></span>${p.owner ? `${dot(p.owner)}<span class="end">${P[p.owner].name}</span>` : `<span class="end warn-text">Ingen</span>`}</div></div></section>`).join("")
      : `<section><div class="group">${sorted.map(maintRow).join("")}</div></section>`}`;
}

function mer() {
  if (sub === "kalender") return kalender();
  if (sub === "budget") return budgetView();
  if (sub === "familj") return familj();
  if (typeof sub === "number") return eventView(events[sub]);
  const link = (k, t, s) => `<button class="row tap" data-sub="${k}"><div class="main"><div class="title">${t}</div><div class="sub">${s}</div></div>${svg("chev", "chev")}</button>`;
  const spent = budget.reduce((a, b) => a + b.spent, 0), limit = budget.reduce((a, b) => a + b.limit, 0);
  return `${head("Mer")}
    <section><div class="group">
      ${link("kalender", "Kalender", `Nästa: ${events.slice().sort((a, b) => a.start.localeCompare(b.start))[0].title}`)}
      ${isParent() ? link("budget", "Budget", `${kr(spent)} av ${kr(limit)} den här månaden`) : ""}
      ${link("familj", "Familj", people.map((p) => p.name).join(", "))}
    </div></section>`;
}

const backBtn = (to = "") => `<button class="back" data-sub="${to}">${svg("back", "chev")} ${to === "kalender" ? "Kalender" : "Mer"}</button>`;

function kalender() {
  const list = events.slice().sort((a, b) => a.start.localeCompare(b.start));
  return `<header class="head">${backBtn()}<h1>Kalender</h1></header>
    <section><div class="group">${list.map((e) => `<button class="row tap" data-open-event="${events.indexOf(e)}"><div class="main"><div class="title">${e.title}</div><div class="sub">${e.kind} · ${fmt(e.start)}${e.end ? " – " + fmt(e.end) : ""}</div></div><span class="end">${inDays(daysTo(e.start))}</span></button>`).join("")}</div></section>`;
}

function eventView(e) {
  const d = e.pack ? e.pack.filter((p) => p[1]).length : 0;
  const g = goals[0];
  return `<header class="head">${backBtn("kalender")}<h1>${e.title}</h1><div class="date" style="text-transform:none;margin-top:4px">${fmt(e.start)}${e.end ? " – " + fmt(e.end) : ""}${e.place ? " · " + e.place : ""}</div></header>
    ${e.pack ? `<section><h2>Sparmål</h2><div class="group">${goalRow(g)}</div></section>
    <section><h2>Packlista <span>${d} av ${e.pack.length}</span></h2><div class="group">${e.pack.map(([t, x]) => `<div class="row${x ? " done" : ""}"><span class="check" aria-hidden="true" ${x ? 'style="background:var(--accent);border-color:var(--accent);color:var(--accent-ink)"' : ""}>${x ? svg("tick", "", "0 0 16 16") : ""}</span><div class="main"><div class="title">${t}</div></div></div>`).join("")}</div></section>` : `<p class="note">${inDays(daysTo(e.start))}.</p>`}`;
}

function budgetView() {
  const spent = budget.reduce((a, b) => a + b.spent, 0), limit = budget.reduce((a, b) => a + b.limit, 0);
  const month = new Intl.DateTimeFormat("sv-SE", { month: "long" }).format(today);
  return `<header class="head">${backBtn()}<h1>Budget</h1><div class="date">${month}</div></header>
    <section><div class="group"><div class="row" style="display:block"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="big">${kr(limit - spent)}</span><span class="end">kvar av ${kr(limit)}</span></div>${bar(pct(spent, limit))}</div></div></section>
    <section><h2>Kategorier</h2><div class="group">${budget.map((c) => {
      const over = c.spent > c.limit;
      return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span class="title">${c.name}</span><span class="end ${over ? "warn-text" : ""}">${over ? `${kr(c.spent - c.limit)} över` : `${kr(c.limit - c.spent)} kvar`}</span></div>${bar(pct(c.spent, c.limit), over)}</div>`;
    }).join("")}</div></section>
    <p class="note">Bara vuxna ser budgeten.</p>`;
}

function familj() {
  return `<header class="head">${backBtn()}<h1>Familj</h1></header>
    <section><div class="group">${people.map((p) => `<div class="row">${dot(p.id)}<div class="main"><div class="title">${p.name}</div><div class="sub">${p.role === "parent" ? "Vuxen" : "Barn, loggar in med PIN"}</div></div></div>`).join("")}</div></section>`;
}

// ---- Rendering ----------------------------------------------------------
const TABS = [["hem", "Hem", "home"], ["mal", "Mål", "goal"], ["rutiner", "Rutiner", "routine"], ["hemmet", "Hemmet", "house"], ["mer", "Mer", "more"]];
const VIEWS = { hem, mal, rutiner, hemmet, mer };

function render() {
  if (!isParent() && sub === "budget") sub = null;
  document.getElementById("who").innerHTML = people.map((p) => `<button data-me="${p.id}" aria-pressed="${p.id === me}">${p.name}</button>`).join("");
  document.getElementById("tabs").innerHTML = TABS.map(([k, l, i]) => `<button data-tab="${k}" ${tab === k ? 'aria-current="page"' : ""}>${svg(i)}${l}</button>`).join("");
  const s = document.getElementById("screen");
  s.innerHTML = VIEWS[tab]();
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  const screen = document.getElementById("screen");
  let scrollTop = true;
  if (d.task) { done.has(d.task) ? done.delete(d.task) : done.add(d.task); store.set("done", [...done]); scrollTop = false; }
  else if (d.me) { me = d.me; store.set("me", me); }
  else if (d.tab) { tab = d.tab; sub = null; store.set("tab", tab); }
  else if (d.filter) { routineFilter = d.filter; scrollTop = false; }
  else if (d.house) { houseView = d.house; scrollTop = false; }
  else if ("toggleDone" in d) { showDone = !showDone; scrollTop = false; }
  else if ("sub" in d) { sub = d.sub || null; tab = "mer"; }
  else if ("openEvent" in d) { sub = Number(d.openEvent); tab = "mer"; }
  else return;
  const y = screen.scrollTop;
  render();
  screen.scrollTop = scrollTop ? 0 : y;
});

render();
</script>

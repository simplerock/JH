<style>
/* Layout: en mobilskärm i taget. Grupperade listor på mjuk yta, inga ramar. Färg bara för progress, klart, väntar och försenat. */
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --ink: #1d1f1e;
  --muted: #6f736f;
  --line: #ebe7df;
  --track: #ebe7df;
  --accent: #2f6f55;
  --accent-ink: #ffffff;
  --accent-soft: #e3efe8;
  --warn: #c2552d;
  --warn-soft: #f8e6dd;
  --wait: #9a6a00;
  --wait-soft: #f7ecd2;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131514; --surface: #1c1f1d; --ink: #eceeed; --muted: #9aa09d; --line: #2a2e2c; --track: #2a2e2c;
    --accent: #5fbf93; --accent-ink: #0f1d16; --accent-soft: #1d3127; --warn: #ef8a62; --warn-soft: #3a241b;
    --wait: #e2b54a; --wait-soft: #352a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131514; --surface: #1c1f1d; --ink: #eceeed; --muted: #9aa09d; --line: #2a2e2c; --track: #2a2e2c;
  --accent: #5fbf93; --accent-ink: #0f1d16; --accent-soft: #1d3127; --warn: #ef8a62; --warn-soft: #3a241b;
  --wait: #e2b54a; --wait-soft: #352a12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.proto-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; padding: 12px 16px; font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--track); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { padding: 5px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.link { color: var(--accent); font-weight: 500; font-size: 14px; }

.phone { position: relative; max-width: 400px; margin: 0 auto 24px; background: var(--bg); min-height: 720px; display: flex; flex-direction: column; }

.screen { flex: 1; overflow-y: auto; padding: 28px 16px 24px; display: flex; flex-direction: column; gap: 28px; }

.head .date { font-size: 13px; color: var(--muted); }
.head .date.cap { text-transform: capitalize; }
.head h1 { margin: 2px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.back { display: inline-flex; gap: 2px; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 6px; }

section > h2 { margin: 0 0 8px; padding: 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
section > h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.group { background: var(--surface); border-radius: var(--radius); padding: 0 16px; }
.group > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 0; min-height: 56px; }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 500; }
.row .sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
.row .end { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; flex-shrink: 0; }
.row.done .title { color: var(--muted); text-decoration: line-through; }
.row.tap { width: 100%; text-align: left; }
.block { padding: 16px 0; }
.split { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.small { font-size: 13px; color: var(--muted); }

.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; display: grid; place-items: center; transition: transform .1s; }
.check:active { transform: scale(.88); }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check.wait { border-color: var(--wait); border-style: dashed; }
.check svg { width: 14px; height: 14px; }
.check:disabled { cursor: default; }
.check:disabled:not(.on):not(.wait) { opacity: .35; }

.bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar.thin { height: 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.bar.over > i { background: var(--warn); }
@media (prefers-reduced-motion: reduce) { .bar > i, .check { transition: none; } }

.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--track); color: var(--muted); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.wait { background: var(--wait-soft); color: var(--wait); }
.pts { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.pts svg { width: 15px; height: 15px; }
.warn-text { color: var(--warn) !important; }

.hero { background: var(--accent-soft); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 2px; text-align: left; width: 100%; }
.hero .k { color: var(--accent); font-size: 14px; font-weight: 600; }
.hero .t { font-size: 20px; font-weight: 700; }
.hero .s { color: var(--muted); font-size: 14px; }
.hero .pill { margin-top: 8px; align-self: flex-start; }

.score { background: var(--surface); border-radius: var(--radius); padding: 18px 16px; text-align: left; width: 100%; }
.score .num { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 14px; }
.ladder div { height: 6px; border-radius: 99px; background: var(--track); }
.ladder div.on { background: var(--accent); }
.ladder div.low.on { background: var(--warn); }
.score .next { margin-top: 10px; font-size: 14px; color: var(--muted); }

.photo { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--track); display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center; }
.approve { display: flex; gap: 8px; padding: 0 0 14px 64px; }
.btn { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
.btn-ghost { background: var(--track); border-radius: 10px; padding: 7px 14px; font-weight: 500; font-size: 14px; }

.big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--muted); padding: 0 4px; margin: 0; }
.empty { padding: 18px 0; color: var(--muted); font-size: 15px; }
.done-toggle { color: var(--muted); font-size: 14px; padding: 12px 0; width: 100%; text-align: left; }
ol.steps { margin: 0; padding: 14px 0 14px 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
ol.steps li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }

nav.tabs { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 12px; font-size: 11px; font-weight: 500; color: var(--muted); position: relative; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs .badge { position: absolute; top: 5px; left: calc(50% + 6px); background: var(--wait); color: var(--surface); font-size: 10px; font-weight: 700; border-radius: 99px; min-width: 16px; height: 16px; display: grid; place-items: center; padding: 0 4px; }
.chev { color: var(--muted); width: 18px; height: 18px; flex-shrink: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

function fakePhoto(label, hue) {
  const s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="hsl(${hue} 35% 78%)"/><rect x="14" y="58" width="92" height="34" rx="6" fill="hsl(${hue} 30% 92%)"/><rect x="18" y="46" width="30" height="16" rx="6" fill="#fff"/><text x="60" y="110" font-family="sans-serif" font-size="11" text-anchor="middle" fill="hsl(${hue} 30% 30%)">${label}</text></svg>`;

const pendingPts = (kid) => tasks.filter((t) => t.who === kid && kidStatus(t.id) === "pending").reduce((a, t) => a + (t.pts || 0), 0);
const pendingList = () => tasks.filter((t) => kidStatus(t.id) === "pending");

const pct = (a, b) => (b > 0 ? Math.min(1, a / b) : 0);
const bar = (r, { over, thin } = {}) => `<div class="bar${over ? " over" : ""}${thin ? " thin" : ""}"><i style="width:${Math.round(r * 100)}%"></i></div>`;
const dot = (id, size) => (id ? `<span class="dot" style="background:${P[id].color}${size ? `;width:${size}px;height:${size}px` : ""}" title="${P[id].name}">${P[id].name[0]}</span>` : "");
const dueIn = (m) => daysTo(m.last) + m.every;
const ptsTag = (t) => (t.pts ? `<span class="pts">${t.photo ? svg("cam") : ""}${t.pts} p</span>` : "");

// ---- Rader -----------------------------------------------------------------
function taskRow(t, { showWho } = {}) {
  const kid = isKidTask(t);
  const s = kid ? kidStatus(t.id) : state.done[t.id] ? "approved" : null;
  const k = state.kid[t.id];
  const can = t.who === me || (isParent() && !kid);
  const subline = [t.area, t.due ? `senast ${fmt(t.due)}` : t.rec].filter(Boolean).join(" · ");
  const label = s === "approved" ? `Ångra ${t.title}` : t.photo && kid ? `Ta foto och skicka ${t.title}` : `Klar med ${t.title}`;
  const mark = `<button class="check${s === "approved" ? " on" : s === "pending" ? " wait" : ""}" data-task="${t.id}" ${can && s !== "pending" ? "" : "disabled"} aria-label="${esc(label)}">${s === "approved" ? svg("tick", "", "0 0 16 16") : ""}</button>`;
  const status = kid && s === "pending" ? `<span class="pill wait">Väntar</span>` : kid && s === "redo" ? `<span class="pill warn">Gör om</span>` : ptsTag(t);
  return `<div class="row${s === "approved" ? " done" : ""}">
    ${mark}
    <div class="main"><div class="title">${esc(t.title)}</div><div class="sub">${subline}${kid && s === "redo" && k?.note ? ` · <span class="warn-text">${esc(k.note)}</span>` : ""}</div></div>
    ${status}
    ${showWho ? dot(t.who) : ""}
  </div>`;
}

function goalRow(g, { owner } = {}) {
  const r = pct(g.cur, g.target);
  const n = (v) => (g.unit === "kr" ? new Intl.NumberFormat("sv-SE").format(v) : v);
  return `<div class="block">
    <div class="split"><span style="font-weight:500;min-width:0">${g.title}</span><span class="small" style="font-weight:600">${Math.round(r * 100)}%</span></div>
    ${bar(r)}
    <div class="split small" style="margin-top:6px;align-items:center"><span>${n(g.cur)} av ${n(g.target)} ${g.unit}</span><span style="display:flex;gap:8px;align-items:center">${daysTo(g.due)} dagar kvar ${owner ? dot(g.owner, 20) : ""}</span></div>
  </div>`;
}

function maintRow(m, showOwner = true) {
  const n = dueIn(m);
  return `<div class="row">
    <div class="main"><div class="title">${m.title}</div><div class="sub ${n < 0 ? "warn-text" : ""}">${n < 0 ? `Försenad ${-n} dagar` : n === 0 ? "Idag" : `Om ${n} dagar`}</div></div>
    ${showOwner ? (m.owner ? dot(m.owner) : `<span class="pill warn">Ingen</span>`) : ""}
  </div>`;
}

function projectBlock(p) {
  const d = p.steps.filter((s) => s[1]).length;
  return `<div class="block">
    <div class="split" style="align-items:center"><span style="font-weight:500">${p.title}</span><span class="pill ${p.status === "Pågår" ? "ok" : ""}">${p.status}</span></div>
    ${p.steps.length ? `${bar(d / p.steps.length)}<div class="small" style="margin-top:6px">${d} av ${p.steps.length} steg · ${kr(p.spent)} av ${kr(p.budget)}</div>` : `<div class="small" style="margin-top:4px">Budget ${kr(p.budget)}</div>`}
  </div>`;
}

// ---- Skärmar ---------------------------------------------------------------
function head(title, { date, back, sub: s } = {}) {
  const d = new Intl.DateTimeFormat("sv-SE", { weekday: "long", day: "numeric", month: "long" }).format(today);
  return `<header class="head">${back ? `<button class="back" data-sub="">${svg("back", "chev")} ${back}</button>` : ""}${date ? `<div class="date cap">${d}</div>` : ""}<h1>${title}</h1>${s ? `<div class="date">${s}</div>` : ""}</header>`;
}

function tripHero() {
  return `<button class="hero" data-sub="resa"><span class="k">${inDays(daysTo(trip.start))}</span><span class="t">${trip.title}</span><span class="s">${fmt(trip.start)} – ${fmt(trip.end)} · ${trip.sub}</span>${trip.booked ? "" : `<span class="pill warn">Flyget är inte bokat</span>`}</button>`;
}

function scoreCard(kid) {
  const n = points(kid), lvl = levelFor(n), idx = levels.indexOf(lvl);
  const next = levels[idx - 1];
  const filled = levels.length - idx;
  const pend = pendingPts(kid);
  return `<button class="score" data-sub="poang">
    <div class="split" style="align-items:center"><span class="num">${n}</span><span class="pill ${lvl.low ? "warn" : "ok"}">${lvl.name}</span></div>
    <div class="small" style="margin-top:6px">poäng vecka ${week}${pend ? ` · ${pend} väntar på godkännande` : ""}</div>
    <div class="ladder">${[...levels].reverse().map((l, i) => `<div class="${i < filled ? "on" : ""}${lvl.low ? " low" : ""}"></div>`).join("")}</div>
    <div class="next">${next ? `${next.min - n} poäng till ${next.name}: ${next.reward.charAt(0).toLowerCase() + next.reward.slice(1)}.` : `Högsta nivån! ${lvl.reward}.`} ${daysLeftInWeek ? `${daysLeftInWeek} dagar kvar.` : "Sista dagen."}</div>
  </button>`;
}

function approvals() {
  const list = pendingList();
  if (!list.length) return "";
  return `<section><h2>Att godkänna <span>${list.length}</span></h2><div class="group">${list.map((t) => {
    const k = state.kid[t.id];
    return `<div>
      <div class="row">
        ${k.photo ? `<img class="photo" src="${k.photo}" alt="Foto av ${esc(t.title.toLowerCase())}">` : `<span class="photo">Inget foto</span>`}
        <div class="main"><div class="title">${esc(t.title)}</div><div class="sub">${P[t.who].name} · ${k.at || "nyss"} · ${t.pts} p</div></div>
      </div>
      <div class="approve">
        <button class="btn" data-approve="${t.id}">Godkänn</button>
        <button class="btn-ghost" data-redo="${t.id}">Gör om</button>
      </div>
    </div>`;
  }).join("")}</div></section>`;
}

const doneToggle = (closed) => closed.length ? `<button class="done-toggle" data-toggle-done>${showDone ? "Dölj klara" : `Visa klara (${closed.length})`}</button>${showDone ? closed.map((t) => taskRow(t)).join("") : ""}` : "";

function hem() {
  if (!isParent()) return kidHome();
  const my = tasks.filter((t) => t.who === me && t.rec !== "En gång");
  const tripTodo = tasks.filter((t) => t.who === me && t.rec === "En gång" && !isDoneTask(t));
  const open = my.filter((t) => !isDoneTask(t)), closed = my.filter(isDoneTask);
  const myMaint = maint.filter((m) => m.owner === me && dueIn(m) <= 30).sort((a, b) => dueIn(a) - dueIn(b));
  const myProj = projects.filter((x) => x.owner === me && x.status !== "Klart");
  const myGoals = goals.filter((g) => g.owner === me);
  const orphans = [...projects, ...maint, ...goals].filter((x) => !x.owner).length;

  return `${head(`Hej ${P[me].name}`, { date: true })}
    ${tripHero()}
    ${approvals()}
    ${tripTodo.length ? `<section><h2>Inför resan</h2><div class="group">${tripTodo.map((t) => taskRow(t)).join("")}</div></section>` : ""}
    <section><h2>Att göra <span>${closed.length} av ${my.length} klara</span></h2><div class="group">
      ${open.length ? open.map((t) => taskRow(t)).join("") : `<div class="empty">Allt klart.</div>`}
      ${doneToggle(closed)}
    </div></section>
    <section><h2>Barnens vecka</h2><div class="group">${kids.map((k) => {
      const n = points(k.id), l = levelFor(n);
      return `<button class="row tap" data-sub="poang">${dot(k.id)}<div class="main"><div class="split"><span class="title">${k.name}</span><span class="small">${n} p · ${l.name}</span></div>${bar(pct(n, 50), { thin: true, over: l.low })}</div></button>`;
    }).join("")}</div></section>
    ${myMaint.length ? `<section><h2>Underhåll snart</h2><div class="group">${myMaint.map((m) => maintRow(m, false)).join("")}</div></section>` : ""}
    ${myProj.length ? `<section><h2>Dina projekt</h2><div class="group">${myProj.map(projectBlock).join("")}</div></section>` : ""}
    ${myGoals.length ? `<section><h2>Dina mål</h2><div class="group">${myGoals.map((g) => goalRow(g)).join("")}</div></section>` : ""}
    ${orphans ? `<p class="note">${orphans} saker saknar ansvarig. <button class="link" data-tab="hemmet">Fördela</button></p>` : ""}`;
}

function kidHome() {
  const my = tasks.filter((t) => t.who === me);
  const daily = my.filter((t) => t.rec !== "En gång" && !isDoneTask(t) && kidStatus(t.id) !== "pending");
  const tripTasks = my.filter((t) => t.rec === "En gång" && !isDoneTask(t) && kidStatus(t.id) !== "pending");
  const waiting = my.filter((t) => kidStatus(t.id) === "pending");
  const closed = my.filter(isDoneTask);
  const myGoals = goals.filter((g) => g.owner === me);
  const myMaint = maint.filter((m) => m.owner === me && dueIn(m) <= 30);
  return `${head(`Hej ${P[me].name}`, { date: true })}
    ${scoreCard(me)}
    <section><h2>Att göra <span>${closed.length} av ${my.length} klara</span></h2><div class="group">
      ${daily.length ? daily.map((t) => taskRow(t)).join("") : `<div class="empty">Allt gjort. Snyggt jobbat!</div>`}
      ${doneToggle(closed)}
    </div></section>
    ${waiting.length ? `<section><h2>Väntar på mamma eller pappa</h2><div class="group">${waiting.map((t) => taskRow(t)).join("")}</div></section>` : ""}
    ${tripTasks.length ? `<section><h2>Inför ${trip.title}</h2><div class="group">${tripTasks.map((t) => taskRow(t)).join("")}</div></section>` : ""}
    ${myMaint.length ? `<section><h2>Ditt ansvar hemma</h2><div class="group">${myMaint.map((m) => maintRow(m, false)).join("")}</div></section>` : ""}
    ${myGoals.length ? `<section><h2>Dina mål</h2><div class="group">${myGoals.map((g) => goalRow(g)).join("")}</div></section>` : ""}
    ${tripHero()}`;
}

function mal() {
  const cats = [...new Set(goals.map((g) => g.cat))];
  return `${head("Mål")}${cats.map((c) => `<section><h2>${c}</h2><div class="group">${goals.filter((g) => g.cat === c).map((g) => goalRow(g, { owner: true })).join("")}</div></section>`).join("")}`;
}

function rutiner() {
  const base = tasks.filter((t) => t.rec !== "En gång");
  const list = routineFilter === "mina" ? base.filter((t) => t.who === me) : base;
  const groups = [["Varje dag", "Idag"], ["Varje vecka", `Vecka ${week}`], ["Varje månad", "Den här månaden"]];
  return `${head("Rutiner")}
    <div class="seg" role="group" aria-label="Filter" style="align-self:flex-start">
      <button data-filter="mina" aria-pressed="${routineFilter === "mina"}">Mina</button>
      <button data-filter="alla" aria-pressed="${routineFilter === "alla"}">Alla</button>
    </div>
    ${groups.map(([g, label]) => {
      const l = list.filter((t) => t.rec === g);
      if (!l.length) return "";
      return `<section><h2>${label} <span>${l.filter(isDoneTask).length} av ${l.length}</span></h2><div class="group">${l.map((t) => taskRow(t, { showWho: routineFilter === "alla" })).join("")}</div></section>`;
    }).join("")}
    ${!list.length ? `<div class="group"><div class="empty">Inga rutiner för dig.</div></div>` : ""}`;
}

function hemmet() {
  return `${head("Hemmet")}
    <div class="seg" role="group" aria-label="Visa" style="align-self:flex-start">
      <button data-house="projekt" aria-pressed="${houseView === "projekt"}">Projekt</button>
      <button data-house="underhall" aria-pressed="${houseView === "underhall"}">Underhåll</button>
    </div>
    ${houseView === "projekt"
      ? projects.map((p) => `<section><div class="group">${projectBlock(p)}${p.steps.map(([s, d]) => `<div class="row${d ? " done" : ""}"><span class="check${d ? " on" : ""}" aria-hidden="true">${d ? svg("tick", "", "0 0 16 16") : ""}</span><div class="main"><div class="title">${s}</div></div></div>`).join("")}<div class="row"><span class="small" style="flex:1">Ansvarig</span>${p.owner ? `${dot(p.owner)}<span class="end">${P[p.owner].name}</span>` : `<span class="pill warn">Ingen</span>`}</div></div></section>`).join("")
      : `<section><div class="group">${[...maint].sort((a, b) => dueIn(a) - dueIn(b)).map((m) => maintRow(m)).join("")}</div></section>`}`;
}

function mer() {
  const views = { kalender, budget: budgetView, familj, poang, resa };
  if (sub && views[sub]) return views[sub]();
  const link = (k, t, s, extra = "") => `<button class="row tap" data-sub="${k}"><div class="main"><div class="title">${t}</div><div class="sub">${s}</div></div>${extra}${svg("chev", "chev")}</button>`;
  const spent = budget.reduce((a, b) => a + b.spent, 0), limit = budget.reduce((a, b) => a + b.limit, 0);
  return `${head("Mer")}
    <section><div class="group">
      ${link("resa", trip.title, `${fmt(trip.start)} – ${fmt(trip.end)} · Jaynie planerar`, trip.booked ? "" : `<span class="pill warn">Ej bokat</span>`)}
      ${link("kalender", "Kalender", `Nästa: ${events[0].title}`)}
      ${link("poang", "Poäng och förmåner", kids.map((k) => `${k.name} ${points(k.id)} p`).join(", "))}
      ${isParent() ? link("budget", "Budget", `${kr(limit - spent)} kvar den här månaden`) : ""}
      ${link("familj", "Familjen Hiew", people.map((p) => p.name).join(", "))}
    </div></section>`;
}

function resa() {
  const todo = tasks.filter((t) => t.area === "Zhangjiajie");
  const done = todo.filter(isDoneTask).length;
  return `${head(trip.title, { back: "Mer", sub: `${fmt(trip.start)} – ${fmt(trip.end)} · ${trip.sub}` })}
    <section><h2>Flyg ${trip.booked ? `<span class="pill ok">Bokat</span>` : `<span class="pill warn">Inte bokat</span>`}</h2><div class="group">${trip.flights.map((f) => `<div class="row"><div class="main"><div class="title">${f.route}</div><div class="sub">${fmtDay(f.date)} · ${f.no} · ${f.time}</div></div></div>`).join("")}</div></section>
    <section><h2>Inför resan <span>${done} av ${todo.length}</span></h2><div class="group">${todo.map((t) => taskRow(t, { showWho: true })).join("")}</div></section>
    ${isParent() ? `<section><h2>Resekassa</h2><div class="group">${goalRow(goals[0])}</div></section>` : ""}
    <section><h2>Packlistor</h2><div class="group">${kids.map((k) => {
      const l = trip.pack[k.id], d = l.filter((x) => x[1]).length;
      return `<div class="block"><div class="split"><span style="display:flex;gap:8px;align-items:center;font-weight:500">${dot(k.id)}${k.name}</span><span class="small">${d} av ${l.length}</span></div>${bar(d / l.length, { thin: true })}</div>`;
    }).join("")}</div></section>
    <section><h2>Program</h2><div class="group"><ol class="steps">${trip.days.map((d) => `<li>${d}</li>`).join("")}</ol></div></section>
    <section><h2>Hotell</h2><div class="group">${trip.hotels.map(([n, h]) => `<div class="row"><div class="main"><div class="title">${h}</div></div><span class="end">${n}</span></div>`).join("")}</div></section>`;
}

function poang() {
  return `${head("Poäng och förmåner", { back: "Mer", sub: `Vecka ${week}. Nollställs på måndag.` })}
    ${isParent() ? `<section><div class="group">${kids.map((k) => {
      const n = points(k.id), l = levelFor(n);
      return `<div class="block"><div class="split" style="align-items:center"><span style="display:flex;gap:8px;align-items:center;font-weight:600">${dot(k.id)}${k.name}</span><span class="pill ${l.low ? "warn" : "ok"}">${n} p · ${l.name}</span></div>${bar(pct(n, 50), { over: l.low })}</div>`;
    }).join("")}</div></section>` : scoreCard(me)}
    <section><h2>Nivåer</h2><div class="group">${levels.map((l) => `<div class="row"><div class="main"><div class="title">${l.name} · ${l.min ? `${l.min}+ p` : `under ${levels[levels.length - 2].min} p`}</div><div class="sub">${l.reward}</div></div></div>`).join("")}</div></section>
    <section><h2>Så funkar det</h2><div class="group"><ol class="steps">
      <li>Gör sysslan ordentligt.</li>
      <li>Tryck klar. Har sysslan en kamera tar du ett foto.</li>
      <li>Mamma eller pappa godkänner. Först då räknas poängen.</li>
      <li>Är det inte klart blir det gör om, utan poäng.</li>
      <li>På söndag kväll får du förmånen för din nivå.</li>
    </ol></div></section>`;
}

function kalender() {
  const all = [{ title: trip.title, kind: "Resa", start: trip.start, end: trip.end, link: "resa" }, ...events].sort((a, b) => a.start.localeCompare(b.start));
  return `${head("Kalender", { back: "Mer" })}
    <section><div class="group">${all.map((e) => `<button class="row tap" ${e.link ? `data-sub="${e.link}"` : ""}><div class="main"><div class="title">${e.title}</div><div class="sub">${e.kind} · ${fmt(e.start)}${e.end ? " – " + fmt(e.end) : ""}</div></div><span class="end">${inDays(daysTo(e.start))}</span></button>`).join("")}</div></section>`;
}

function budgetView() {
  const spent = budget.reduce((a, b) => a + b.spent, 0), limit = budget.reduce((a, b) => a + b.limit, 0);
  const month = new Intl.DateTimeFormat("sv-SE", { month: "long" }).format(today);
  return `${head("Budget", { back: "Mer", sub: month.charAt(0).toUpperCase() + month.slice(1) })}
    <section><div class="group"><div class="block"><div class="split"><span class="big">${kr(limit - spent)}</span><span class="small">kvar av ${kr(limit)}</span></div>${bar(pct(spent, limit))}</div></div></section>
    <section><h2>Kategorier</h2><div class="group">${budget.map((c) => {
      const over = c.spent > c.limit;
      return `<div class="block"><div class="split"><span style="font-weight:500">${c.name}</span><span class="small ${over ? "warn-text" : ""}">${over ? `${kr(c.spent - c.limit)} över` : `${kr(c.limit - c.spent)} kvar`}</span></div>${bar(pct(c.spent, c.limit), { over, thin: true })}</div>`;
    }).join("")}</div></section>
    <p class="note">Restaurangvalet vid Guld dras från Restaurang.</p>`;
}

function familj() {
  return `${head("Familjen Hiew", { back: "Mer" })}
    <section><div class="group">${people.map((p) => `<div class="row">${dot(p.id, 32)}<div class="main"><div class="title">${p.name} <span style="color:var(--muted);font-weight:400">· ${p.title}</span></div><div class="sub">${p.job}</div></div></div>`).join("")}</div></section>`;
}

// ---- Rendering --------------------------------------------------------------
const TABS = [["hem", "Hem", "home"], ["mal", "Mål", "goal"], ["rutiner", "Rutiner", "routine"], ["hemmet", "Hemmet", "house"], ["mer", "Mer", "more"]];
const VIEWS = { hem, mal, rutiner, hemmet, mer };

function render() {
  if (!isParent() && sub === "budget") sub = null;
  document.getElementById("who").innerHTML = people.map((p) => `<button data-me="${p.id}" aria-pressed="${p.id === me}">${p.name}</button>`).join("");
  const badge = isParent() ? pendingList().length : 0;
  document.getElementById("tabs").innerHTML = TABS.map(([k, l, i]) => `<button data-tab="${k}" ${tab === k ? 'aria-current="page"' : ""}>${svg(i)}${l}${k === "hem" && badge ? `<span class="badge">${badge}</span>` : ""}</button>`).join("");
  document.getElementById("screen").innerHTML = VIEWS[tab]();
}

const nowTime = () => new Intl.DateTimeFormat("sv-SE", { hour: "2-digit", minute: "2-digit" }).format(new Date());

function toggleTask(id) {
  const t = T[id];
  if (!isKidTask(t)) {
    if (state.done[id]) delete state.done[id]; else state.done[id] = true;
    return true;
  }
  if (kidStatus(id) === "approved") { delete state.kid[id]; return true; }
  if (t.photo) {
    cameraFor = id;
    const cam = document.getElementById("camera");
    cam.value = "";
    cam.click();
    return false;
  }
  state.kid[id] = { status: "pending", at: nowTime() };
  return true;
}

// Fotot skalas ner till 320 px innan det sparas i webbläsaren.
document.getElementById("camera").addEventListener("change", (ev) => {
  const file = ev.target.files?.[0];
  if (!file || !cameraFor) return;
  const id = cameraFor;
  cameraFor = null;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 320 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    state.kid[id] = { status: "pending", photo: c.toDataURL("image/jpeg", 0.7), at: nowTime() };
    save(); render();
  };
  img.src = URL.createObjectURL(file);
});

document.getElementById("reset").addEventListener("click", () => { state = seed(); save(); render(); });

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b || b.id === "reset") return;
  const d = b.dataset;
  const screen = document.getElementById("screen");
  let top = true, changed = true;
  if (d.task) { changed = toggleTask(d.task); top = false; }
  else if (d.approve) { state.kid[d.approve] = { status: "approved" }; top = false; }
  else if (d.redo) { state.kid[d.redo] = { status: "redo", note: "Inte riktigt klart" }; top = false; }
  else if (d.me) { me = d.me; store.set("me", me); sub = null; tab = "hem"; showDone = false; }
  else if (d.tab) { tab = d.tab; sub = null; }
  else if (d.filter) { routineFilter = d.filter; top = false; }
  else if (d.house) { houseView = d.house; top = false; }
  else if ("toggleDone" in d) { showDone = !showDone; top = false; }
  else if ("sub" in d) { sub = d.sub || null; tab = "mer"; }
  else return;
  if (!changed) return;
  save();
  const y = screen.scrollTop;
  render();
  screen.scrollTop = top ? 0 : y;
});

render();
</script>
